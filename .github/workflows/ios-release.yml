name: Build & Deploy iOS to App Store Connect

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16 (iOS 18 SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install Apple Certificate and Provisioning Profile
        env:
          DIST_KEY_BASE64: ""
          DIST_CERT_BASE64: ""
          BUILD_PROVISION_PROFILE_BASE64: ""
          KEYCHAIN_PASSWORD: "temporal-keychain-pass"
        run: |
          KEY_PATH=$RUNNER_TEMP/dist.key
          CERT_PATH=$RUNNER_TEMP/dist.pem
          P12_PATH=$RUNNER_TEMP/dist.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$DIST_KEY_BASE64" | base64 --decode -o "$KEY_PATH"
          echo -n "$DIST_CERT_BASE64" | base64 --decode -o "$CERT_PATH"

          openssl pkcs12 -export -inkey "$KEY_PATH" -in "$CERT_PATH" -out "$P12_PATH" -password pass:temp123 -legacy || openssl pkcs12 -export -inkey "$KEY_PATH" -in "$CERT_PATH" -out "$P12_PATH" -password pass:temp123

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$P12_PATH" -P "temp123" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/699df6db-2ed2-44d1-a367-a93bbd242047.mobileprovision
          echo "Certificate & Provisioning Profile installed successfully!"

      - name: Build iOS Archive
        run: |
          mkdir -p build/export
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            PROVISIONING_PROFILE_SPECIFIER="Health365 AppStore" \
            DEVELOPMENT_TEAM="SB294UBAU7" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ios/exportOptions.plist

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Health365-iOS-IPA
          path: build/export/*.ipa

      - name: Upload to App Store Connect
        env:
          AUTH_KEY_P8_BASE64: ""
          KEY_ID: "57L59F4TN5"
          ISSUER_ID: "4402efd6-33f9-4a0e-9c48-aa81acc49077"
        run: |
          IPA_PATH=$(find build/export -name "*.ipa" | head -n 1)
          echo "Uploading $IPA_PATH to App Store Connect..."
          
          mkdir -p ~/.private_keys
          mkdir -p ~/.appstoreconnect/private_keys
          
          echo -n "$AUTH_KEY_P8_BASE64" | base64 --decode -o ~/.private_keys/AuthKey_${KEY_ID}.p8
          echo -n "$AUTH_KEY_P8_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          
          chmod 600 ~/.private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "${KEY_ID}" \
            --apiIssuer "${ISSUER_ID}"
